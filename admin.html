<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 文档转换专家</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-box h1 { font-size: 24px; color: #333; margin-bottom: 10px; }
        .login-box p { color: #999; font-size: 14px; margin-bottom: 25px; }
        .login-box input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .login-box input:focus { outline: none; border-color: #667eea; }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-box button:hover { opacity: 0.9; }
        .login-error { color: #dc3545; font-size: 13px; margin-top: 5px; display: none; }

        /* 后台主体 */
        .admin-layout { display: none; }
        .admin-header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .admin-header h1 { font-size: 20px; color: #333; }
        .admin-header .back-link {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .admin-header .back-link:hover { text-decoration: underline; }
        .admin-header .header-actions { display: flex; align-items: center; gap: 15px; }
        .admin-header .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
        }
        .admin-header .refresh-btn:hover { background: #5568d3; }
        .admin-header .logout-btn {
            background: #e9ecef;
            color: #666;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
        }
        .admin-header .logout-btn:hover { background: #dee2e6; }

        .admin-content { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .stat-card .stat-value { font-size: 32px; font-weight: 700; color: #333; }
        .stat-card .stat-label { font-size: 14px; color: #999; margin-top: 5px; }
        .stat-card.purple .stat-value { color: #667eea; }
        .stat-card.green .stat-value { color: #28a745; }
        .stat-card.orange .stat-value { color: #f5af19; }
        .stat-card.red .stat-value { color: #dc3545; }

        /* 搜索和筛选 */
        .toolbar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .toolbar input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        .toolbar input:focus { outline: none; border-color: #667eea; }
        .toolbar select {
            padding: 10px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            background: white;
        }
        .toolbar select:focus { outline: none; border-color: #667eea; }

        /* 用户表格 */
        .user-table-wrap {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
        }
        .user-table th {
            background: #f8f9fa;
            padding: 14px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            border-bottom: 1px solid #e9ecef;
        }
        .user-table td {
            padding: 14px 16px;
            font-size: 14px;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
        }
        .user-table tr:hover { background: #fafbfc; }
        .user-table .vip-tag {
            display: inline-block;
            background: linear-gradient(135deg, #f5af19, #f12711);
            color: white;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }
        .user-table .free-tag {
            display: inline-block;
            background: #e9ecef;
            color: #666;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        .user-table .action-btns { display: flex; gap: 6px; }
        .user-table .action-btn {
            padding: 5px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-vip { background: #fff3cd; color: #856404; }
        .btn-vip:hover { background: #ffeaa7; }
        .btn-cancel { background: #f8d7da; color: #721c24; }
        .btn-cancel:hover { background: #f5c6cb; }
        .btn-delete { background: #e9ecef; color: #666; }
        .btn-delete:hover { background: #dee2e6; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty-state .empty-icon { font-size: 48px; margin-bottom: 15px; }

        /* VIP设置弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 35px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalIn 0.3s ease;
            position: relative;
        }
        @keyframes modalIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal h3 { font-size: 18px; color: #333; margin-bottom: 15px; }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            font-size: 24px; color: #999;
            cursor: pointer;
        }
        .modal .user-display {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #333;
        }
        .modal .vip-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .modal .vip-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal .vip-option:hover { border-color: #667eea; }
        .modal .vip-option.selected { border-color: #667eea; background: #f0f4ff; }
        .modal .vip-option .opt-name { font-weight: 500; color: #333; }
        .modal .vip-option .opt-price { color: #667eea; font-weight: 600; }
        .modal .confirm-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .modal .confirm-btn:hover { opacity: 0.9; }
        .modal .custom-days {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .modal .custom-days input {
            width: 80px;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .user-table { font-size: 12px; }
            .user-table th, .user-table td { padding: 10px 8px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- 管理员登录 -->
    <div class="login-page" id="loginPage">
        <div class="login-box">
            <h1>🔐 管理后台</h1>
            <p>请输入管理员密码</p>
            <input type="password" id="adminPwd" placeholder="管理员密码" onkeydown="if(event.key==='Enter')doAdminLogin()">
            <div class="login-error" id="loginError"></div>
            <button onclick="doAdminLogin()">登 录</button>
            <p style="margin-top:20px;"><a href="index.html" style="color:#667eea;text-decoration:none;font-size:13px;">← 返回首页</a></p>
        </div>
    </div>

    <!-- 后台主体 -->
    <div class="admin-layout" id="adminLayout">
        <div class="admin-header">
            <div>
                <h1>🛠️ 管理后台</h1>
            </div>
            <div class="header-actions">
                <a href="index.html" class="back-link">← 返回首页</a>
                <button class="refresh-btn" onclick="loadUsers()">🔄 刷新</button>
                <button class="logout-btn" onclick="doAdminLogout()">退出</button>
            </div>
        </div>

        <div class="admin-content">
            <!-- 统计 -->
            <div class="stats-grid">
                <div class="stat-card purple">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">注册用户</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-value" id="statVip">0</div>
                    <div class="stat-label">VIP用户</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-value" id="statToday">0</div>
                    <div class="stat-label">今日活跃</div>
                </div>
                <div class="stat-card red">
                    <div class="stat-value" id="statConverts">0</div>
                    <div class="stat-label">总转换次数</div>
                </div>
            </div>

            <!-- 搜索 -->
            <div class="toolbar">
                <input type="text" id="searchInput" placeholder="搜索手机号/邮箱..." oninput="filterUsers()">
                <select id="filterStatus" onchange="filterUsers()">
                    <option value="all">全部用户</option>
                    <option value="vip">VIP用户</option>
                    <option value="free">免费用户</option>
                </select>
            </div>

            <!-- 用户表格 -->
            <div class="user-table-wrap">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>账号</th>
                            <th>VIP状态</th>
                            <th>到期时间</th>
                            <th>注册日期</th>
                            <th>最后登录</th>
                            <th>转换次数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📋</div>暂无用户数据</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- VIP设置弹窗 -->
    <div class="modal-overlay" id="vipSetModal">
        <div class="modal">
            <button class="modal-close" onclick="closeVipModal()">&times;</button>
            <h3>👑 开通VIP</h3>
            <div class="user-display" id="vipUserDisplay"></div>
            <div class="vip-options">
                <div class="vip-option selected" onclick="selectVipOption(this, 7)">
                    <span class="opt-name">7天VIP</span>
                    <span class="opt-price">¥3.9</span>
                </div>
                <div class="vip-option" onclick="selectVipOption(this, 30)">
                    <span class="opt-name">月度VIP (30天)</span>
                    <span class="opt-price">¥9.9</span>
                </div>
                <div class="vip-option" onclick="selectVipOption(this, 365)">
                    <span class="opt-name">年度VIP (365天)</span>
                    <span class="opt-price">¥59.9</span>
                </div>
                <div class="vip-option" onclick="selectVipOption(this, 0)">
                    <div class="custom-days">
                        <span class="opt-name">自定义天数</span>
                        <input type="number" id="customDays" value="30" min="1" max="3650" onclick="event.stopPropagation()">
                        <span style="color:#999;font-size:13px;">天</span>
                    </div>
                    <span class="opt-price">免费</span>
                </div>
            </div>
            <button class="confirm-btn" onclick="confirmSetVip()">✅ 确认开通</button>
        </div>
    </div>

    <script>
        const apiUrl = 'https://web-production-84201.up.railway.app';
        let allUsers = [];
        let currentSetUserId = null;
        let selectedDays = 7;

        // 管理员登录
        async function doAdminLogin() {
            const pwd = document.getElementById('adminPwd').value;
            if (!pwd) {
                document.getElementById('loginError').textContent = '请输入密码';
                document.getElementById('loginError').style.display = 'block';
                return;
            }
            try {
                const res = await fetch(`${apiUrl}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                if (res.ok) {
                    localStorage.setItem('admin-token', '1');
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('adminLayout').style.display = 'block';
                    loadUsers();
                } else {
                    const data = await res.json();
                    document.getElementById('loginError').textContent = data.detail || '密码错误';
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch(e) {
                document.getElementById('loginError').textContent = '网络错误';
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function doAdminLogout() {
            localStorage.removeItem('admin-token');
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminLayout').style.display = 'none';
        }

        // 检查登录状态
        if (localStorage.getItem('admin-token')) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminLayout').style.display = 'block';
            loadUsers();
        }

        // 加载用户
        async function loadUsers() {
            try {
                const res = await fetch(`${apiUrl}/api/admin/users`);
                if (res.ok) {
                    const data = await res.json();
                    allUsers = data.users;
                    updateStats();
                    filterUsers();
                } else {
                    doAdminLogout();
                }
            } catch(e) {
                console.error('加载用户失败', e);
            }
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = allUsers.length;
            document.getElementById('statVip').textContent = allUsers.filter(u => u.is_vip).length;

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('statToday').textContent = allUsers.filter(u => u.last_login === today).length;
            document.getElementById('statConverts').textContent = allUsers.reduce((sum, u) => sum + (u.total_count || 0), 0);
        }

        function filterUsers() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const status = document.getElementById('filterStatus').value;

            let filtered = allUsers;
            if (search) {
                filtered = filtered.filter(u =>
                    (u.phone && u.phone.includes(search)) ||
                    (u.email && u.email.toLowerCase().includes(search)) ||
                    (u.user_id && u.user_id.toLowerCase().includes(search))
                );
            }
            if (status === 'vip') filtered = filtered.filter(u => u.is_vip);
            if (status === 'free') filtered = filtered.filter(u => !u.is_vip);

            renderTable(filtered);
        }

        function renderTable(users) {
            const tbody = document.getElementById('userTableBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📋</div>暂无匹配的用户</div></td></tr>';
                return;
            }

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>
                        <div style="font-weight:500;">${u.phone || u.email || '-'}</div>
                        <div style="font-size:11px;color:#999;">ID: ${u.user_id}</div>
                    </td>
                    <td>${u.is_vip ? '<span class="vip-tag">👑 VIP</span>' : '<span class="free-tag">免费</span>'}</td>
                    <td>${u.is_vip && u.vip_expire ? u.vip_expire : '-'}</td>
                    <td>${u.created_at || '-'}</td>
                    <td>${u.last_login || '-'}</td>
                    <td>${u.total_count || 0}</td>
                    <td>
                        <div class="action-btns">
                            ${u.is_vip
                                ? `<button class="action-btn btn-cancel" onclick="cancelVip('${u.user_id}')">取消VIP</button>`
                                : `<button class="action-btn btn-vip" onclick="showVipSetModal('${u.user_id}')">开通VIP</button>`
                            }
                            <button class="action-btn btn-delete" onclick="deleteUser('${u.user_id}')">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // VIP设置弹窗
        function showVipSetModal(userId) {
            currentSetUserId = userId;
            const user = allUsers.find(u => u.user_id === userId);
            if (!user) return;
            document.getElementById('vipUserDisplay').innerHTML = `📱 ${user.phone || '未填'} &nbsp;&nbsp; 📧 ${user.email || '未填'}<br><span style="font-size:12px;color:#999;">ID: ${userId}</span>`;
            selectedDays = 7;
            document.querySelectorAll('.vip-option').forEach((el, i) => {
                el.classList.toggle('selected', i === 0);
            });
            document.getElementById('customDays').value = 30;
            document.getElementById('vipSetModal').classList.add('show');
        }

        function closeVipModal() {
            document.getElementById('vipSetModal').classList.remove('show');
            currentSetUserId = null;
        }

        function selectVipOption(el, days) {
            document.querySelectorAll('.vip-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            if (days === 0) {
                selectedDays = parseInt(document.getElementById('customDays').value) || 30;
            } else {
                selectedDays = days;
            }
        }

        async function confirmSetVip() {
            if (!currentSetUserId) return;
            // 如果选的是自定义天数
            const customEl = document.querySelectorAll('.vip-option')[3];
            if (customEl.classList.contains('selected')) {
                selectedDays = parseInt(document.getElementById('customDays').value) || 30;
            }

            try {
                const res = await fetch(`${apiUrl}/api/admin/set-vip`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentSetUserId, days: selectedDays })
                });
                if (res.ok) {
                    const data = await res.json();
                    alert(data.message);
                    closeVipModal();
                    loadUsers();
                } else {
                    const data = await res.json();
                    alert(data.detail || '操作失败');
                }
            } catch(e) {
                alert('网络错误');
            }
        }

        async function cancelVip(userId) {
            if (!confirm('确定要取消该用户的VIP吗？')) return;
            try {
                const res = await fetch(`${apiUrl}/api/admin/remove-vip/${userId}`, { method: 'POST' });
                if (res.ok) {
                    alert('已取消VIP');
                    loadUsers();
                }
            } catch(e) {
                alert('网络错误');
            }
        }

        async function deleteUser(userId) {
            const user = allUsers.find(u => u.user_id === userId);
            const account = user ? (user.phone || user.email || userId) : userId;
            if (!confirm(`确定要删除用户 "${account}" 吗？此操作不可恢复！`)) return;
            try {
                const res = await fetch(`${apiUrl}/api/admin/delete-user/${userId}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('已删除');
                    loadUsers();
                }
            } catch(e) {
                alert('网络错误');
            }
        }

        // 自动刷新
        setInterval(() => {
            if (document.getElementById('adminLayout').style.display !== 'none') {
                loadUsers();
            }
        }, 60000);
    </script>
</body>
</html>
